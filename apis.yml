aid: iliad-biotechnologies
name: ILiAD Biotechnologies
description: 'ILiAD Biotechnologies, Inc. is a privately held, clinical-stage biotechnology
  company headquartered in Weston, Florida, developing BPZE1 — a live attenuated intranasal
  vaccine candidate designed to prevent Bordetella pertussis (whooping cough) colonization
  and transmission — alongside its B-Tech vector platform, which the company is exploring
  for infectious, allergic, autoimmune and neurodegenerative disease. The BPZE1 technology
  originated at Institut Pasteur de Lille and is exclusively licensed to ILiAD, which
  announced a $115M Series B in February 2026 and received a UK MHRA Innovation Passport
  designation in December 2024. ILiAD publishes a static corporate and scientific website
  only: as of 2026-08-22 it operates no public API, developer portal, SDK, machine-readable
  specification, or any other programmable surface.'
